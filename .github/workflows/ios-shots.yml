name: shots

on:
  push:
    branches: [main, master]
    paths:
      - 'TaoSheng/**'
      - 'project.yml'
      - '.github/workflows/ios-shots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    name: 模拟器截图
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodegen generate

      - name: 关掉模拟器硬件键盘（截图要看到软键盘）
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true

      - name: 准备模拟器
        run: |
          set -x
          xcrun simctl list runtimes || true
          xcrun simctl list devicetypes | head -n 40 || true
          echo "== 已装运行时"
          xcrun simctl list runtimes | grep -E '^iOS' | tail -n 3 || true

      - name: 编译模拟器包
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodebuild \
            -project TaoSheng.xcodeproj \
            -scheme TaoSheng \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -quiet 2>&1 | tail -n 60

      - name: 启动模拟器并截图
        run: |
          set -x
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/TaoSheng.app"
          if [ ! -d "$APP" ]; then
            echo "找不到模拟器包，列出产物："
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          OUT="$GITHUB_WORKSPACE/shots"
          LOGS="$OUT/logs"
          mkdir -p "$OUT" "$LOGS"

          # 运行时与设备类型按 runner 上真实可用的做兜底，避免 "Unable to find a device"
          RT=$(xcrun simctl list runtimes | grep -E '^iOS [0-9]+(\.[0-9]+)* ' | tail -n 1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/')
          if [ -z "$RT" ]; then echo "没有可用的 iOS 运行时"; xcrun simctl list runtimes; exit 1; fi
          echo "运行时: $RT"

          pick_type() {
            for t in "$@"; do
              if xcrun simctl list devicetypes | grep -q "$t"; then
                echo "$(xcrun simctl list devicetypes | grep "$t" | head -n 1 | sed -E 's/^(.*) \(([^)]*)\)$/\2/')"
                return 0
              fi
            done
            return 1
          }

          BIG=$(pick_type "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15") || BIG=""
          SMALL=$(pick_type "iPhone SE (3rd generation)" "iPhone SE (2nd generation)") || SMALL=""
          echo "大屏: $BIG  小屏: $SMALL"

          mk() {
            local NAME="$1" TYPE="$2" DEV PLIST
            xcrun simctl delete "$NAME" 2>/dev/null || true
            DEV=$(xcrun simctl create "$NAME" "$TYPE" "$RT")
            # 关掉「连接硬件键盘」：模拟器默认把 Mac 键盘当硬件键盘，软键盘就不弹，
            # 小屏的「新的人物」输入框截出来没有键盘。这个开关存在设备自己的 device.plist 里，
            # 必须在 boot 之前改，boot 之后改要重启设备才生效。
            PLIST="$HOME/Library/Developer/CoreSimulator/Devices/$DEV/device.plist"
            if [ -f "$PLIST" ]; then
              plutil -replace ConnectHardwareKeyboard -bool false "$PLIST" 2>/dev/null \
                || plutil -insert ConnectHardwareKeyboard -bool false "$PLIST" 2>/dev/null || true
              echo "已关闭硬件键盘: $DEV" >&2
            fi
            # 只有 UDID 走 stdout：调用方是 DEV=$(mk ...)，多余输出会一起被捕获
            echo "$DEV"
          }

          # macOS runner 上没有 GNU timeout，先装 coreutils 用 gtimeout；没有就直跑
          brew install coreutils >/dev/null 2>&1 || true
          TMO=""
          if command -v gtimeout >/dev/null 2>&1; then TMO="gtimeout"; fi
          echo "超时命令: $TMO"

          tmo() {
            local SECS="$1"; shift
            if [ -n "$TMO" ]; then "$TMO" "$SECS" "$@"; else "$@"; fi
          }

          # 关掉系统引导页，否则键盘起来时会被「滑动输入」介绍盖住
          quiet_system_ui() {
            local DEV="$1" k
            for k in DidShowContinuousPathIntroduction DidShowGestureKeyboardIntroduction DidShowContinuousPathIntroductionV2; do
              tmo 30 xcrun simctl spawn "$DEV" defaults write com.apple.Preferences "$k" -bool true 2>/dev/null || true
              tmo 30 xcrun simctl spawn "$DEV" defaults write com.apple.keyboard.preferences "$k" -bool true 2>/dev/null || true
            done
            tmo 30 xcrun simctl spawn "$DEV" defaults write com.apple.Preferences DidShowKeyboardIntroduction -bool true 2>/dev/null || true
            # 语言/区域固定，避免首次启动的引导
            tmo 30 xcrun simctl spawn "$DEV" defaults write NSGlobalDomain AppleLanguages -array zh-Hans 2>/dev/null || true
            tmo 30 xcrun simctl spawn "$DEV" defaults write NSGlobalDomain AppleLocale -string zh_CN 2>/dev/null || true
          }

          # 全程带超时，避免 simctl 在 CI 上卡死把整个 job 拖到 timeout
          boot_dev() {
            local DEV="$1"
            echo "[$(date +%T)] boot $DEV"
            tmo 120 xcrun simctl boot "$DEV" 2>/dev/null || true
            tmo 300 xcrun simctl bootstatus "$DEV" -b || true
            if xcrun simctl list devices | grep -F "$DEV" | grep -q "Booted"; then
              echo "[$(date +%T)] booted"
            else
              echo "[$(date +%T)] 启动超时，设备未就绪"
              xcrun simctl list devices | grep -F "$DEV" || true
            fi
            quiet_system_ui "$DEV"
            sleep 3
          }

          app_running() {
            local DEV="$1"
            tmo 30 xcrun simctl spawn "$DEV" launchctl list 2>/dev/null | grep -q "$BID"
          }

          # simctl install 会在安装真正落地前就返回（installcoordinationd 还在装占位包），
          # 这时 launch 会报 App not found、截图拍到的是桌面。必须等 bundle 真正可查。
          wait_installed() {
            local DEV="$1" i
            for i in $(seq 1 30); do
              if xcrun simctl get_app_container "$DEV" "$BID" app >/dev/null 2>&1; then
                echo "  安装已就绪（第 ${i} 次探测）"
                return 0
              fi
              sleep 2
            done
            echo "  等待安装超时"
            return 1
          }

          # 启动后轮询，直到 App 进程真的起来，避免固定 sleep 拍早了
          launch_and_wait() {
            local DEV="$1" SCREEN="$2" i
            for i in 1 2 3; do
              if tmo 60 xcrun simctl launch "$DEV" "$BID" -TSShot "$SCREEN"; then
                local j
                for j in $(seq 1 15); do
                  if app_running "$DEV"; then return 0; fi
                  sleep 1
                done
              fi
              echo "  第 $i 次启动没成功，2 秒后再试"
              sleep 2
            done
            return 1
          }

          dump_diag() {
            local DEV="$1" NAME="$2"
            echo "  == 诊断 $NAME"
            tmo 60 xcrun simctl spawn "$DEV" log show --last 90s --style compact \
              --predicate "process == \"TaoSheng\" OR eventMessage CONTAINS \"TaoSheng\"" \
              > "$LOGS/$NAME-app.log" 2>/dev/null || true
            tail -n 40 "$LOGS/$NAME-app.log" || true
            cp -R "$HOME/Library/Logs/DiagnosticReports" "$LOGS/$NAME-crashes" 2>/dev/null || true
            ls -la "$LOGS/$NAME-crashes" 2>/dev/null | tail -n 10 || true
            tmo 60 xcrun simctl spawn "$DEV" launchctl list 2>/dev/null | head -n 40 > "$LOGS/$NAME-launchctl.txt" || true
          }

          shoot_dev() {
            local DEV="$1" NAME="$2" SCREEN="$3" WAIT="${4:-6}"
            echo "[$(date +%T)] == $NAME / $SCREEN"
            if ! tmo 120 xcrun simctl install "$DEV" "$APP"; then
              echo "  安装失败，跳过 $SCREEN"
              return 0
            fi
            wait_installed "$DEV" || true
            sleep 2
            if ! launch_and_wait "$DEV" "$SCREEN"; then
              echo "  App 没起来，记录诊断后重试"
              dump_diag "$DEV" "$NAME-$SCREEN-fail1"
              launch_and_wait "$DEV" "$SCREEN" || true
            fi
            if app_running "$DEV"; then
              echo "  App 运行中"
            else
              echo "  App 仍未运行，记录诊断"
              dump_diag "$DEV" "$NAME-$SCREEN-fail2"
            fi
            sleep "$WAIT"
            if tmo 60 xcrun simctl io "$DEV" screenshot "$OUT/$NAME-$SCREEN.png"; then
              if app_running "$DEV"; then
                echo "  截图 $NAME-$SCREEN.png  $(stat -f%z "$OUT/$NAME-$SCREEN.png") bytes"
              else
                # 截完发现 App 不在前台，这张大概率是桌面，删掉重拍一次
                echo "  截图后 App 不在运行，删掉重拍"
                rm -f "$OUT/$NAME-$SCREEN.png"
                launch_and_wait "$DEV" "$SCREEN" || true
                sleep "$WAIT"
                tmo 60 xcrun simctl io "$DEV" screenshot "$OUT/$NAME-$SCREEN.png" \
                  && echo "  重拍 $NAME-$SCREEN.png  $(stat -f%z "$OUT/$NAME-$SCREEN.png") bytes"
              fi
            else
              echo "  截图失败 $NAME/$SCREEN"
            fi
            tmo 30 xcrun simctl terminate "$DEV" "$BID" 2>/dev/null || true
            sleep 1
          }

          if [ -n "$BIG" ]; then
            DEV=$(mk TS-Big "$BIG")
            echo "大屏设备: $DEV"
            boot_dev "$DEV"
            shoot_dev "$DEV" "iphone16" "todo"
            shoot_dev "$DEV" "iphone16" "today"
            shoot_dev "$DEV" "iphone16" "ask"
            shoot_dev "$DEV" "iphone16" "memory"
            shoot_dev "$DEV" "iphone16" "recording-bottom" 8
            shoot_dev "$DEV" "iphone16" "person-add" 8
            shoot_dev "$DEV" "iphone16" "event-edit" 8
            shoot_dev "$DEV" "iphone16" "transcribe" 7
            shoot_dev "$DEV" "iphone16" "llm" 7
            shoot_dev "$DEV" "iphone16" "today-live" 7
            shoot_dev "$DEV" "iphone16" "today-done" 7
            shoot_dev "$DEV" "iphone16" "event-meeting" 8
            shoot_dev "$DEV" "iphone16" "speaker-rename" 8
            tmo 60 xcrun simctl shutdown "$DEV" 2>/dev/null || true
          fi
          if [ -n "$SMALL" ]; then
            DEVS=$(mk TS-Small "$SMALL")
            echo "小屏设备: $DEVS"
            boot_dev "$DEVS"
            shoot_dev "$DEVS" "iphonese" "todo"
            shoot_dev "$DEVS" "iphonese" "today"
            shoot_dev "$DEVS" "iphonese" "recording-bottom" 8
            shoot_dev "$DEVS" "iphonese" "person-add" 8
            shoot_dev "$DEVS" "iphonese" "transcribe" 7
            shoot_dev "$DEVS" "iphonese" "llm" 7
            shoot_dev "$DEVS" "iphonese" "today-live" 7
            shoot_dev "$DEVS" "iphonese" "today-done" 7
            shoot_dev "$DEVS" "iphonese" "event-meeting" 8
            shoot_dev "$DEVS" "iphonese" "speaker-rename" 8
            tmo 60 xcrun simctl shutdown "$DEVS" 2>/dev/null || true
          fi

          ls -la "$OUT"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-060
          path: ${{ github.workspace }}/shots
          retention-days: 30
          if-no-files-found: warn
