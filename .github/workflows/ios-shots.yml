name: shots

on:
  push:
    branches: [main, master]
    paths:
      - 'TaoSheng/**'
      - 'project.yml'
      - '.github/workflows/ios-shots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    name: 模拟器截图
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodegen generate

      - name: 关掉模拟器硬件键盘（截图要看到软键盘）
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true

      - name: 准备模拟器
        run: |
          set -x
          xcrun simctl list runtimes || true
          xcrun simctl list devicetypes | head -n 40 || true
          echo "== 已装运行时"
          xcrun simctl list runtimes | grep -E '^iOS' | tail -n 3 || true

      - name: 编译模拟器包
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodebuild \
            -project TaoSheng.xcodeproj \
            -scheme TaoSheng \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -quiet 2>&1 | tail -n 60

      - name: 启动模拟器并截图
        run: |
          set -x
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/TaoSheng.app"
          if [ ! -d "$APP" ]; then
            echo "找不到模拟器包，列出产物："
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"

          # 运行时与设备类型按 runner 上真实可用的做兜底，避免 "Unable to find a device"
          RT=$(xcrun simctl list runtimes | grep -E '^iOS [0-9]+(\.[0-9]+)* ' | tail -n 1 | sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/')
          if [ -z "$RT" ]; then echo "没有可用的 iOS 运行时"; xcrun simctl list runtimes; exit 1; fi
          echo "运行时: $RT"

          pick_type() {
            for t in "$@"; do
              if xcrun simctl list devicetypes | grep -q "$t"; then
                echo "$(xcrun simctl list devicetypes | grep "$t" | head -n 1 | sed -E 's/^(.*) \(([^)]*)\)$/\2/')"
                return 0
              fi
            done
            return 1
          }

          BIG=$(pick_type "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15") || BIG=""
          SMALL=$(pick_type "iPhone SE (3rd generation)" "iPhone SE (2nd generation)") || SMALL=""
          echo "大屏: $BIG  小屏: $SMALL"

          mk() {
            NAME="$1"; TYPE="$2"
            xcrun simctl delete "$NAME" 2>/dev/null || true
            xcrun simctl create "$NAME" "$TYPE" "$RT"
          }

          # macOS runner 上没有 GNU timeout，先装 coreutils 用 gtimeout；没有就直跑
          brew install coreutils >/dev/null 2>&1 || true
          TMO=""
          if command -v gtimeout >/dev/null 2>&1; then TMO="gtimeout"; fi
          echo "超时命令: $TMO"

          tmo() {
            SECS="$1"; shift
            if [ -n "$TMO" ]; then "$TMO" "$SECS" "$@"; else "$@"; fi
          }

          # 全程带超时，避免 simctl 在 CI 上卡死把整个 job 拖到 timeout
          boot_dev() {
            DEV="$1"
            echo "[$(date +%T)] boot $DEV"
            tmo 120 xcrun simctl boot "$DEV" 2>/dev/null || true
            tmo 300 xcrun simctl bootstatus "$DEV" -b || true
            if xcrun simctl list devices | grep -F "$DEV" | grep -q "Booted"; then
              echo "[$(date +%T)] booted"
            else
              echo "[$(date +%T)] 启动超时，设备未就绪"
              xcrun simctl list devices | grep -F "$DEV" || true
            fi
            sleep 3
          }

          shoot_dev() {
            DEV="$1"; NAME="$2"; SCREEN="$3"; WAIT="${4:-5}"
            echo "[$(date +%T)] == $NAME / $SCREEN"
            if tmo 90 xcrun simctl install "$DEV" "$APP"; then
              echo "  安装成功"
            else
              echo "  安装失败，跳过 $SCREEN"
              return 0
            fi
            tmo 60 xcrun simctl launch "$DEV" "$BID" -TSShot "$SCREEN" || echo "  启动超时"
            sleep "$WAIT"
            if tmo 60 xcrun simctl io "$DEV" screenshot "$OUT/$NAME-$SCREEN.png"; then
              echo "  截图 $NAME-$SCREEN.png"
            else
              echo "  截图失败 $NAME/$SCREEN"
            fi
            tmo 30 xcrun simctl terminate "$DEV" "$BID" 2>/dev/null || true
          }

          if [ -n "$BIG" ]; then
            DEV=$(mk TS-Big "$BIG")
            echo "大屏设备: $DEV"
            boot_dev "$DEV"
            shoot_dev "$DEV" "iphone16" "todo"
            shoot_dev "$DEV" "iphone16" "today"
            shoot_dev "$DEV" "iphone16" "ask"
            shoot_dev "$DEV" "iphone16" "memory"
            shoot_dev "$DEV" "iphone16" "recording-bottom" 6
            shoot_dev "$DEV" "iphone16" "person-add" 6
            shoot_dev "$DEV" "iphone16" "event-edit" 6
            tmo 60 xcrun simctl shutdown "$DEV" 2>/dev/null || true
          fi
          if [ -n "$SMALL" ]; then
            DEVS=$(mk TS-Small "$SMALL")
            echo "小屏设备: $DEVS"
            boot_dev "$DEVS"
            shoot_dev "$DEVS" "iphonese" "todo"
            tmo 60 xcrun simctl shutdown "$DEVS" 2>/dev/null || true
          fi

          ls -la "$OUT"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-052
          path: ${{ github.workspace }}/shots
          retention-days: 30
          if-no-files-found: warn
