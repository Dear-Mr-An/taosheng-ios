name: build-ipa

on:
  push:
    branches: [main, master]
    paths:
      - 'TaoSheng/**'
      - 'project.yml'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: 构建未签名 IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 安装 Node（SQL 回归用）
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: SQL 回归（node --test）
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          node --test Tests/segment-sql.test.mjs

      - name: 策略单元测试（swift test）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          swift test 2>&1 | tail -n 40

      - name: 生成 Xcode 工程
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then
            xcodegen generate
          else
            cd ios && xcodegen generate && cd ..
          fi
          ls -la

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译（不签名）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodebuild \
            -project TaoSheng.xcodeproj \
            -scheme TaoSheng \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TaoSheng.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            -quiet 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: 编译警告清单
        if: always()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          if [ -f "$LOG" ]; then
            echo "== warning count =="
            grep -c "warning:" "$LOG" || true
            echo "== unique warnings =="
            grep "warning:" "$LOG" | sed 's|.*/TaoSheng/|TaoSheng/|' | sort -u | head -80 || true
            echo "== errors =="
            grep -E "error:" "$LOG" | head -40 || true
          fi

      - name: 打包成 IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/TaoSheng.xcarchive/Products/Applications/TaoSheng.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 .app，列出 archive 内容："
            find "$RUNNER_TEMP/TaoSheng.xcarchive" -maxdepth 4 -name "*.app"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # 注意：必须改 Payload 里的那份 plist。以前改的是 archive 里的原文件，
          # 而 cp 已经先跑完了，产出的 IPA 里一直是二进制 plist
          #（部分国产签名工具读二进制 plist 会静默失败：签名成功但装不上）。
          PLIST="$RUNNER_TEMP/Payload/TaoSheng.app/Info.plist"
          # 先删再加：archive 里的 plist 通常已经带一条 iPhoneOS，
          # 直接 Add :0 会插成两条（0.5.1 的 IPA 就是这个症状）。
          /usr/libexec/PlistBuddy -c "Delete :CFBundleSupportedPlatforms" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" "$PLIST"
          plutil -convert xml1 "$PLIST"
          head -c 120 "$PLIST"; echo
          PF_COUNT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" "$PLIST" | grep -c "iPhoneOS" || true)
          echo "CFBundleSupportedPlatforms 条数：$PF_COUNT"
          if [ "$PF_COUNT" != "1" ]; then echo "Info.plist 的 CFBundleSupportedPlatforms 必须恰好一条"; exit 1; fi
          cd "$RUNNER_TEMP"
          zip -qr "TaoSheng-unsigned.ipa" Payload
          ls -lh "TaoSheng-unsigned.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" || true
          lipo -info "$APP/TaoSheng" || true

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaoSheng-unsigned-ipa
          path: ${{ runner.temp }}/TaoSheng-unsigned.ipa
          retention-days: 30

      - name: 发布到 Release（公开直链，无需登录）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="ipa-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/TaoSheng-unsigned.ipa#TaoSheng-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TaoSheng 未签名 IPA $TAG" \
            --notes "自动构建的未签名 IPA。commit ${GITHUB_SHA}。用 Sideloadly / AltStore 自签安装。" \
            --latest
          echo "已发布: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
  shots:
    name: 模拟器截图
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodegen generate

      - name: 关掉模拟器硬件键盘（截图要看到软键盘）
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true

      - name: 编译模拟器包
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodebuild \
            -project TaoSheng.xcodeproj \
            -scheme TaoSheng \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -quiet 2>&1 | tail -n 60

      - name: 启动模拟器并截图
        run: |
          set -x
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/TaoSheng.app"
          if [ ! -d "$APP" ]; then
            echo "找不到模拟器包，列出产物："
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"

          shoot() {
            DEV="$1"; NAME="$2"; SCREEN="$3"; WAIT="${4:-4}"
            echo "== $NAME / $SCREEN"
            xcrun simctl boot "$DEV" 2>/dev/null || true
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl install "$DEV" "$APP"
            xcrun simctl terminate "$DEV" "$BID" 2>/dev/null || true
            xcrun simctl launch "$DEV" "$BID" -TSShot "$SCREEN" || true
            sleep "$WAIT"
            xcrun simctl io "$DEV" screenshot "$OUT/$NAME-$SCREEN.png"
            xcrun simctl terminate "$DEV" "$BID" 2>/dev/null || true
            xcrun simctl shutdown "$DEV" 2>/dev/null || true
          }

          shoot "iPhone 16" "iphone16" "todo"
          shoot "iPhone 16" "iphone16" "today"
          shoot "iPhone 16" "iphone16" "ask"
          shoot "iPhone 16" "iphone16" "memory"
          shoot "iPhone 16" "iphone16" "recording-bottom" 5
          shoot "iPhone 16" "iphone16" "person-add" 5
          shoot "iPhone 16" "iphone16" "event-edit" 5
          shoot "iPhone SE (3rd generation)" "iphonese" "todo"

          ls -la "$OUT"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-052
          path: ${{ github.workspace }}/shots
          retention-days: 30
          if-no-files-found: warn
