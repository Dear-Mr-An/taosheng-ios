name: build-ipa

on:
  push:
    branches: [main, master]
    paths:
      - 'TaoSheng/**'
      - 'project.yml'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: 构建未签名 IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 策略单元测试（swift test）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          swift test 2>&1 | tail -n 40

      - name: 生成 Xcode 工程
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then
            xcodegen generate
          else
            cd ios && xcodegen generate && cd ..
          fi
          ls -la

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译（不签名）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -f project.yml ]; then ROOT="."; else ROOT="ios"; fi
          cd "$ROOT"
          xcodebuild \
            -project TaoSheng.xcodeproj \
            -scheme TaoSheng \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TaoSheng.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            -quiet 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: 编译警告清单
        if: always()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          if [ -f "$LOG" ]; then
            echo "== warning count =="
            grep -c "warning:" "$LOG" || true
            echo "== unique warnings =="
            grep "warning:" "$LOG" | sed 's|.*/TaoSheng/|TaoSheng/|' | sort -u | head -80 || true
            echo "== errors =="
            grep -E "error:" "$LOG" | head -40 || true
          fi

      - name: 打包成 IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/TaoSheng.xcarchive/Products/Applications/TaoSheng.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 .app，列出 archive 内容："
            find "$RUNNER_TEMP/TaoSheng.xcarchive" -maxdepth 4 -name "*.app"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # 转成 XML plist：部分国产签名工具读二进制 plist 会静默失败（签名成功但装不上）
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" "$APP/Info.plist" 2>/dev/null || true
          plutil -convert xml1 "$APP/Info.plist"
          head -c 120 "$APP/Info.plist"; echo
          cd "$RUNNER_TEMP"
          zip -qr "TaoSheng-unsigned.ipa" Payload
          ls -lh "TaoSheng-unsigned.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true
          lipo -info "$APP/TaoSheng" || true

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaoSheng-unsigned-ipa
          path: ${{ runner.temp }}/TaoSheng-unsigned.ipa
          retention-days: 30

      - name: 发布到 Release（公开直链，无需登录）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="ipa-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/TaoSheng-unsigned.ipa#TaoSheng-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TaoSheng 未签名 IPA $TAG" \
            --notes "自动构建的未签名 IPA。commit ${GITHUB_SHA}。用 Sideloadly / AltStore 自签安装。" \
            --latest
          echo "已发布: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
